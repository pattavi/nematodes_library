<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nematode Library</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="static.css">
</head>
<body>
<header class="top">
  <div>
    <h1 id="title"></h1>
    <p id="subtitle" class="muted"></p>
  </div>
  <div class="right">
  <a id="upload-btn" class="adminbtn uploadbtn" href="/upload"></a>
  <button id="admin-btn" class="adminbtn"></button>
  <div class="lang" role="group" aria-label="Language">
    <button data-lang="th">ไทย</button>
    <button data-lang="en">EN</button>
  </div>
  </div>
</header>

<main>
  <div class="toolbar">
    <div class="searchbox">
      <input id="q" type="search" autocomplete="off">
      <button id="qclear" class="x" hidden>×</button>
    </div>
    <div class="sort" role="group">
      <button data-sort="asc"></button>
      <button data-sort="desc"></button>
    </div>
  </div>
  <div class="viewbar">
    <div class="sort" role="group">
      <button data-view="list"></button>
      <button data-view="map"></button>
    </div>
    <select id="prov" hidden aria-label="Province"></select>
  </div>
  <div id="chips" class="chips"></div>
  <nav id="letters" class="letters"></nav>
  <div class="status"><span id="count"></span> <button id="clear" class="link" hidden></button>
    <button id="exp-btn" class="expbtn"></button>
    <button id="add-btn" class="addbtn" hidden></button></div>
  <div id="grid" class="grid"></div>
  <div id="mapview" class="mapview" hidden>
    <div id="bigmap" class="bigmap"></div>
    <aside id="maplist" class="maplist"></aside>
  </div>
  <p id="msg" class="muted" hidden></p>
</main>

<dialog id="exp" class="detail login" aria-labelledby="x-title"></dialog>
<dialog id="login" class="detail login" aria-labelledby="l-title"></dialog>
<dialog id="detail" class="detail" aria-labelledby="d-title"></dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="static-shim.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
